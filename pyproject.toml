[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-rofi"
version = "1.0.0"
description = "Fast and secure rofi frontend for Proton Pass (pass-cli)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
pass-rofi = "pass_rofi.launcher:main"
pass-rofi-script = "pass_rofi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pass_rofi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

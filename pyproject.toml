[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-tui"
version = "2.0.0"
description = "Fast and secure terminal TUI for Proton Pass (pass-cli)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
pass-tui = "pass_tui.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pass_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
